<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10171e"><title>Starfort · Kahraman Atölyesi</title>
<style>
:root{color-scheme:dark;--ink:#eee8dc;--muted:#9aa8ae;--gold:#d6b77c;--line:#ffffff16;--panel:#151e27;--control:#202d38}*{box-sizing:border-box}body{margin:0;background:#10171e;color:var(--ink);font:14px/1.5 system-ui,-apple-system,sans-serif}button,select,input{font:inherit}button,select{color:inherit;background:var(--control);border:1px solid var(--line);border-radius:7px}button{cursor:pointer;transition:background .15s,border-color .15s}button:hover{background:#2b3c48;border-color:#ffffff38}button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}button:disabled,select:disabled{opacity:.4;cursor:default}main{display:grid;grid-template-columns:minmax(0,1fr) 300px;height:100dvh}.stage{position:relative;min-width:0;min-height:0}canvas{display:block;width:100%;height:100%;touch-action:none}header{position:absolute;z-index:1;top:25px;left:30px;pointer-events:none}header a{pointer-events:auto;color:var(--muted);text-decoration:none;font-size:12px}.eyebrow{font-size:10px;font-weight:700;letter-spacing:.2em;color:var(--gold);margin:19px 0 2px}h1{font:46px/1.15 Georgia,serif;margin:0 0 5px}#hero-role{margin:0;color:var(--muted)}.stage-footer{position:absolute;bottom:22px;left:30px;right:30px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px}#status{margin:0;color:var(--muted);font-size:12px;max-width:330px}.camera-tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.camera-tools button{padding:8px 11px;font-size:12px;background:#17232cdd;backdrop-filter:blur(12px)}aside{background:var(--panel);border-left:1px solid var(--line);padding:22px 20px;overflow:auto}aside h2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 13px}#heroes{display:grid;grid-template-columns:1fr 1fr;gap:7px}#heroes button{display:flex;align-items:center;gap:8px;padding:7px;text-align:left;min-height:48px;font-size:13px}#heroes button img{width:30px;height:36px;object-fit:cover;object-position:50% 0;border-radius:3px;background:#121b22}#heroes button[aria-pressed=true]{border-color:var(--gold);background:#393328;color:#ffe1a8}section{margin-top:23px;padding-top:20px;border-top:1px solid var(--line)}label,.field-label{display:block;font-size:11px;color:var(--muted);margin:0 0 5px}select{display:block;width:100%;padding:9px 10px;margin:0 0 12px}input[type=range]{width:100%;accent-color:var(--gold);margin:6px 0 2px}#phase{display:block;min-height:22px;color:var(--gold);font-size:11px}.playback{display:flex;gap:7px;align-items:center}.playback select{width:86px;margin:0}.playback button{flex:1;padding:9px 8px;font-size:12px}#wardrobe[hidden]{display:none}#toggle-cloak{width:100%;padding:9px;font-size:12px}details{margin-top:23px;padding-top:16px;border-top:1px solid var(--line)}summary{cursor:pointer;color:var(--muted);font-size:12px}#reference{display:block;width:100%;height:230px;object-fit:contain;margin-top:12px;background:#10171e;border-radius:7px}.hint{font-size:10px;color:var(--muted);margin:14px 0 0}.version-note{font-size:11px;color:var(--muted);margin-top:18px}.stage-tag{position:absolute;right:25px;top:25px;font-size:10px;letter-spacing:.12em;color:var(--muted);border:1px solid var(--line);border-radius:30px;padding:6px 11px;background:#15202999}
@media(max-width:720px){main{grid-template-columns:1fr;height:auto;min-height:100dvh}.stage{height:65svh;min-height:410px}aside{border-left:0;border-top:1px solid var(--line);padding:20px}#heroes{grid-template-columns:repeat(4,1fr)}#heroes button{font-size:11px;padding:6px;gap:5px}#heroes button img{width:23px;height:30px}header{left:20px;top:15px}h1{font-size:35px}.eyebrow{margin-top:11px}.stage-footer{left:20px;right:20px;bottom:15px;align-items:flex-start;flex-direction:column;gap:9px}.stage-tag{right:15px;top:15px;font-size:9px}section{margin-top:18px;padding-top:15px}.camera-tools{justify-content:flex-start}#reference{height:300px}}
@media(prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<main>
<div class="stage">
<canvas aria-label="Kahramanın döndürülebilir üç boyutlu modeli"></canvas>
<header><a href="./">← Köye dön</a><p class="eyebrow">STARFORT · KAHRAMAN ATÖLYESİ</p><h1 id="name">Aldren</h1><p id="hero-role">Öncü · Kılıç ve kalkan</p></header>
<span class="stage-tag">3D ÖNİZLEME</span>
<div class="stage-footer"><p id="status" role="status">Model yükleniyor…</p><nav class="camera-tools" aria-label="Kamera açıları"><button id="front-view">Ön</button><button id="full-body">¾ açı</button><button id="back-view">Arka</button><button id="face-view">Yüz</button></nav></div>
</div>
<aside aria-label="Kahraman ve önizleme ayarları">
<h2>Yedi kahraman</h2><div id="heroes"></div>
<section aria-label="Hareket kontrolleri"><label for="motion">Hareket</label><select id="motion"><option value="Idle">Bekleyiş</option><option value="Walk">Yürüme</option><option value="Run">Koşma</option><option value="Attack">Vuruş</option><option value="Special">Yetenek</option><option value="Guard">Siper</option><option value="Hit">Darbe alma</option><option value="Death">Düşme</option></select><label for="timeline">Hareket zamanı</label><input id="timeline" type="range" min="0" max="100" step="0.1" value="0"><small id="phase" aria-live="off"></small><div class="playback"><button id="pause-motion">Hareketi duraklat</button><select id="speed" aria-label="Oynatma hızı"><option value="0.5">0,5×</option><option value="1" selected>1×</option><option value="1.5">1,5×</option></select></div></section>
<section id="wardrobe" aria-label="Kıyafet önizlemesi" hidden><label for="armor">Kıyafet</label><select id="armor"><option value="base">Kaynak tasarım</option><option value="plate">Çelik göğüs zırhı</option></select><button id="toggle-cloak" aria-pressed="true">Pelerin açık</button></section>
<details><summary>Kaynak tasarımla karşılaştır</summary><img id="reference" alt="Kahramanın kaynak savaş çizimi"></details>
<p class="hint">Modeli sürükleyerek çevir. Tekerlekle veya iki parmakla yakınlaş. Hareket zamanını kaydırarak pozu incele.</p><p class="version-note" id="version-note"></p>
</aside>
</main>
<script type="module" src="assets/rigged/hero-viewer.js"></script>
</body></html>
