<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Starfort · Kahraman Modelleri</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101b22;color:#f1e5d3;font:16px system-ui}header{position:absolute;z-index:1;top:24px;left:28px}h1{font:32px Georgia;margin:8px 0}a{color:#d7b879}main{display:grid;grid-template-columns:1fr 240px;height:100dvh}canvas{width:100%;height:100%;touch-action:none}aside{padding:30px 20px;background:#17232c;overflow:auto}button{display:block;width:100%;padding:12px;margin-bottom:6px;background:#233440;border:1px solid #41515b;color:inherit;text-align:left;cursor:pointer}select{display:block;width:100%;padding:10px;margin:8px 0 10px;background:#233440;color:inherit;border:1px solid #41515b}.view-controls{display:flex;gap:5px;margin-top:16px}.view-controls button{font-size:12px;text-align:center;padding:10px 5px}button[aria-pressed=true]{border-color:#d6b475;color:#f9dca6}#reference{width:100%;height:35vh;object-fit:contain;margin-top:20px}small{color:#a5b4b8}#status{position:absolute;bottom:20px;left:25px} @media(max-width:650px){main{grid-template-columns:1fr 130px}aside{padding:18px 8px}h1{font-size:23px}}

<main><header><a href="./">← Köye dön</a><h1 id="name">Aldren</h1><small>Sürükle ve çevir · Tekerlekle yakınlaş</small></header><canvas aria-label="Kahramanın üç boyutlu modeli"></canvas><aside aria-label="Kahraman seçimi"><div id="heroes"></div><label for="motion">Hareket</label><select id="motion"><option value="Idle">Bekleyiş</option><option value="Walk">Yürüme</option><option value="Run">Koşma</option><option value="Attack">Vuruş</option><option value="Special">Yetenek</option><option value="Guard">Siper</option><option value="Hit">Darbe alma</option></select><label for="speed">Hız</label><select id="speed"><option value="0.5">0,5× · Ağır çekim</option><option value="1" selected>1× · Normal</option><option value="1.5">1,5×</option></select><button id="pause-motion">Hareketi duraklat</button><div class="view-controls"><button id="full-body">Tam boy</button><button id="face-view">Yüzü incele</button></div><img id="reference" alt="Modelin kaynak savaş çizimi"><small>Kaynak çizim</small></aside></main><p id="status">Model yükleniyor…</p><script type="module" src="assets/rigged/hero-viewer.js"></script></html>
