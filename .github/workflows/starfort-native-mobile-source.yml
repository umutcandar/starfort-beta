name: STARFORT Native Mobile Source QA
on:
  pull_request:
    paths:
      - 'mobile/StarfortUnreal/**'
      - '.github/workflows/starfort-native-mobile-source.yml'
  push:
    paths:
      - 'mobile/StarfortUnreal/**'
      - '.github/workflows/starfort-native-mobile-source.yml'
jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate native Unreal mobile source constraints (not an Unreal compile)
        run: |
          python3 mobile/StarfortUnreal/Tools/test_native_mobile.py
          python3 mobile/StarfortUnreal/Tools/test_premium_native_release.py
          python3 mobile/StarfortUnreal/Tools/test_verified_battle_motion_v79.py
          python3 mobile/StarfortUnreal/Tools/test_original_battlefield_v79.py
          python3 mobile/StarfortUnreal/Tools/test_fab_character_review.py
          python3 mobile/StarfortUnreal/Tools/test_fab_seven_private_preview_v80.py
          python3 mobile/StarfortUnreal/Tools/test_fab_interactive_preview_v81.py
          python3 mobile/StarfortUnreal/Tools/test_private_3v1_battle_v82.py
          python3 mobile/StarfortUnreal/Tools/test_private_mobile_touch_v83.py
          python3 mobile/StarfortUnreal/Tools/test_verified_fab_live_bridge_v84.py
          python3 mobile/StarfortUnreal/Tools/test_dynamic_fab_roster_v85.py
          python3 mobile/StarfortUnreal/Tools/test_native_bag_equipment_v86.py
          python3 mobile/StarfortUnreal/Tools/stage_verified_fab_online_battle_v84.py --contract
          python3 mobile/StarfortUnreal/Tools/test_ash_arena_import_scale_v83.py
          python3 mobile/StarfortUnreal/Tools/verify_private_fab_battle_v82.py --contract
          python3 mobile/StarfortUnreal/Tools/fab_seven_private_preview_v80.py --contract
          python3 mobile/StarfortUnreal/Tools/fab_character_review.py --contract
          python3 mobile/StarfortUnreal/Tools/audit_public_asset_hygiene.py
          python3 mobile/StarfortUnreal/Tools/test_cinematic_hero_install.py
          python3 mobile/StarfortUnreal/Tools/test_hero_v2_models.py
          python3 mobile/StarfortUnreal/Tools/validate_hero_v2_models.py --contract-only
          python3 mobile/StarfortUnreal/Tools/validate_premium_art.py --schema-only
