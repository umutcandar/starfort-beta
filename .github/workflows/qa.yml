name: Starfort QA
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax and gameplay tests
        working-directory: starfort
        run: npm run qa:all
      - name: Reference layout browser check (Chromium)
        working-directory: starfort
        run: npm run qa:visual
      - name: Upload layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starfort-layout-screenshots
          if-no-files-found: ignore
          path: starfort/qa-artifacts/*.png
