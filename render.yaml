services:
  - type: web
    name: starfort-online-beta
    runtime: node
    plan: free
    rootDir: starfort
    buildCommand: npm install --omit=dev --no-audit --no-fund
    startCommand: npm run start:cloud
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: STARFORT_HOST
        value: 0.0.0.0
      - key: STARFORT_DATA_DIR
        value: /tmp/starfort-beta-data
      - key: STARFORT_AUTH_REQUIRED
        value: '1'
      - key: STARFORT_TEST_CODE
        sync: false
